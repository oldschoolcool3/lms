name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # zeke/semantic-pull-requests is unmaintained (its @main no longer ships
      # an action manifest, so the job errors at setup). amannn/action-semantic-
      # pull-request is the maintained equivalent. The `types` below mirror
      # commitlint.config.js so this PR-title gate and the commit-title gate
      # (linters.yml commit-lint job) accept exactly the same set.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
            deprecate
