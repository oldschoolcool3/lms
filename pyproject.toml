[project]
name = "lms"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io"}
]
description = "Easy to use, open source, Learning Management System"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # core dependencies
    "websocket_client~=1.6.4",
    "markdown~=3.5.1",
    "beautifulsoup4>=4.12,<4.14",
    "lxml~=6.0.2",
    "cairocffi==1.5.1",
    "razorpay~=1.4.1",
    "fuzzywuzzy~=0.18.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# --- Dev / CI tooling: managed exclusively by uv (PEP 735 dependency groups) ---
# The Frappe app's *runtime* deps (above, plus frappe/payments from
# [tool.bench.frappe-dependencies]) are installed by bench into the bench env.
# uv is the only package manager for this repo's own tooling.
# ruff is pinned exactly so uv, pre-commit (.pre-commit-config.yaml), and the Nx
# targets all run the identical version — bump all three together.
[dependency-groups]
lint = ["ruff==0.15.17", "deptry==0.25.1"]
typecheck = ["pyright==1.1.410"]
dev = [{ include-group = "lint" }, { include-group = "typecheck" }]

[tool.uv]
# Virtual project: uv manages the tool env but never builds the `lms` wheel
# (flit/bench own app installation). This keeps `uv run --only-group lint`
# from having to compile cairocffi/lxml when all we need is ruff.
package = false

[deploy.dependencies.apt]
packages = [
    "libxml2-dev",
    "libxslt1-dev",
]

# --- Ruff: aligned with the org standard (~/projects/power) ---
[tool.ruff]
target-version = "py312"
line-length = 120
# Vendored frappe type stubs (pyright --createstub) — not our code to lint/format.
extend-exclude = ["typings"]

[tool.ruff.lint]
# Matches the org-standard ruff rule set (power). All four docstring rules from
# power are enforced: D101/D102/D103 (docstring *presence*) and D401 (imperative
# mood). The ~418 docstrings this required across inherited frappe/lms code were
# authored in a one-time pass; tests, DocType controllers, reports, patches, and
# a few generated/entrypoint modules stay exempt via the per-file-ignores below.
select = [
    "E", "F", "I", "UP", "B", "S",
    "D101",   # missing docstring in public class
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "D200",   # unnecessary multiline docstring
    "D205",   # blank line after summary
    "D208",   # over-indentation
    "D209",   # newline after last paragraph
    "D210",   # whitespace around docstring text
    "D300",   # use triple double quotes
    "D301",   # use r-prefix for backslash docstrings
    "D400",   # first line should end with period
    "D401",   # first line should be imperative mood
    "D403",   # first word of first line capitalized
    "D415",   # first line should end with punctuation
    "D417",   # missing argument descriptions (Google-style)
]
ignore = [
    "S101",   # assert — used throughout Frappe permission/validation code
    "B008",   # function call in default argument (FastAPI-style; harmless here)
    "S608",   # hardcoded SQL — frappe.db.sql with %()s params is idiomatic Frappe
]
# Treat Frappe's DocType-field alias as a typing module so ruff reads
# `DF.Literal["A", "B"]` in auto-generated controller type blocks as Literal
# values, not forward-reference annotations (matches frappe's own ruff config).
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["override"]

[tool.ruff.lint.per-file-ignores]
# Tests: no docstring requirements; allow asserts, fixture creds, random,
# and best-effort teardown cleanup (try/except/pass).
"**/test_*.py"     = ["D", "S105", "S106", "S110", "S311"]
"**/tests/**/*.py" = ["D", "S105", "S106", "S110", "S311"]
# Frappe DocType controllers and reports are framework boilerplate (generated
# class/method shapes) — exempt from the docstring family.
"**/doctype/**/*.py" = ["D"]
"**/report/**/*.py"  = ["D"]
# One-off migration patches and package markers.
"**/patches/**/*.py" = ["D"]
"**/__init__.py"     = ["D104", "D103"]
# App-level config / entrypoints.
"lms/hooks.py" = ["D"]
# Generated demo content — long inline data strings, not hand-maintained code.
"lms/demo/demo_data.py" = ["E501"]

# --- deptry: dependency hygiene, Frappe-aware ---
[tool.deptry]
# frappe + its stack (pypika/werkzeug/requests) and the payments app are
# bench-injected at runtime (see [tool.bench.frappe-dependencies]); they are not
# in [project.dependencies], so deptry must treat them as provided, not missing.
per_rule_ignores.DEP001 = ["frappe", "payments", "pypika", "requests", "werkzeug"]
# Declared runtime deps used indirectly (by frappe, or for SVG/PDF certificate
# rendering) rather than imported in the app code deptry scans.
per_rule_ignores.DEP002 = ["cairocffi", "lxml", "razorpay", "websocket_client"]

[tool.deptry.package_module_name_map]
# Import name (bs4) differs from the distribution name (beautifulsoup4).
beautifulsoup4 = ["bs4"]

# --- pyright: ratcheted type-checking (see scripts/backend-typecheck.py) ---
# Inherited frappe/lms code can't pass a clean pyright run (dynamic ORM,
# bench-injected frappe), so the gate diffs against backend-typecheck-baseline.json
# and fails only on NEW errors — net-new fork modules are type-checked while the
# backlog is grandfathered. Mirrors the frontend's typecheck-baseline.json.
[tool.pyright]
include = ["lms"]
exclude = ["**/test_*.py", "**/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# frappe + payments are bench-injected and never resolvable in the uv tool env;
# their import errors are pure noise (deptry already guards dependency hygiene).
reportMissingImports = false
reportMissingModuleSource = false

[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<=17.0.0-dev"
payments = ">=0.0.1,<1.0.0"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../lms/public/frontend"
index_html_path = "../lms/www/_lms.html"


[project.urls]
Homepage = "https://frappe.io/learning"
Repository = "https://github.com/frappe/lms.git"
"Bug Reports" = "https://github.com/frappe/lms/issues"
