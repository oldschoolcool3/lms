name: Create weekly release
on:
  # Weekly cadence is dormant until we opt into the upstream-style
  # main-hotfix -> main release flow (needs the main-hotfix + main branches and
  # a RELEASE_TOKEN secret). Re-enable the cron when ready; run manually until
  # then via workflow_dispatch.
  # schedule:
  #   - cron: '30 3 * * 3'
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: octokit/request-action@v2.x
        with:
          route: POST /repos/{owner}/{repo}/pulls
          owner: oldschoolcool3
          repo: lms
          title: |-
            "chore: merge 'main-hotfix' into 'main'"
          body: "Automated weekly release"
          base: main
          head: main-hotfix
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
